services:
  isim:
    build:
      context: .
      network: host
    ports:
      - 8000:8000
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./config/conf_docker.ini:/app/config/conf.ini
    restart: unless-stopped
    networks:
      - casm_isim_test_network

  isim_graphql:
    build:
      context: isim_graphql
      network: host
    ports:
      - 4001:4001
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - casm_isim_test_network

  neo4j_automation:
    build:
      context: .
      dockerfile: Dockerfile.automation
    ports:
      - "5000:5000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:  # ADD THIS SECTION
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
    volumes:
      - ./logs:/app/logs
      - ./config:/config
    networks:
      - casm_isim_test_network
    restart: unless-stopped
    
  neo4j:
    image: neo4j:5.26.1
    environment:
      - NEO4J_AUTH=neo4j/supertestovaciheslo
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
    volumes:
      - neo4j_isim_data:/data
      - ./plugins:/var/lib/neo4j/plugins
    ports:
      - 7474:7474
      - 7687:7687
    networks:
      - casm_isim_test_network
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474/"]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

networks:
  casm_isim_test_network:
    external: true
    name: casm_isim_test_network

volumes:
  neo4j_isim_data: