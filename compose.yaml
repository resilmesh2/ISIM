services:
  resilmesh-sap-isim:
    container_name: resilmesh-sap-isim
    hostname: resilmesh-sap-isim
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      resilmesh-sap-neo4j:
        condition: service_healthy
    volumes:
      - ./config/config_docker.yaml:/app/config/config.yaml
    restart: unless-stopped
    networks:
      - resilmesh_network

  resilmesh-sap-isim-graphql:
    container_name: resilmesh-sap-isim-graphql
    hostname: resilmesh-sap-isim-graphql
    build:
      context: isim_graphql
    ports:
      - 4001:4001
    depends_on:
      resilmesh-sap-neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://resilmesh-sap-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
    restart: unless-stopped
    networks:
      - resilmesh_network

  resilmesh-sap-isim-automation:
    container_name: resilmesh-sap-isim-automation
    build:
      context: .
      dockerfile: automation.Dockerfile
    ports:
      - 5000:5000
    depends_on:
      resilmesh-sap-neo4j:
        condition: service_healthy
    environment:
      - TEMPORAL_URL=resilmesh-sop-wo-temporal:7233
      - NEO4J_URI=bolt://resilmesh-sap-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
    volumes:
      - ./logs:/app/logs
      - ./config:/config
      - ./.env:/app/.env:ro
    networks:
      - resilmesh_network
    restart: unless-stopped
    
  resilmesh-sap-neo4j:
    container_name: resilmesh-sap-neo4j
    image: neo4j:5.26.10
    environment:
      - NEO4J_AUTH=neo4j/supertestovaciheslo
      - NEO4J_PLUGINS=["apoc-extended", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_apoc_trigger_enabled=true
      - NEO4J_apoc_conf_apoc_trigger_enabled=true
      - NEO4J_apoc_initializer_neo4j_cypher_0=CALL apoc.cypher.runFile("file:///triggers.cypher",{reportError:true,statistics:true})
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
    volumes:
      - resilmesh-sap-isim-neo4j-data:/data
      - ./plugins:/var/lib/neo4j/plugins
      - ./neo4j_database/triggers.cypher:/var/lib/neo4j/import/triggers.cypher
#      - ${DATA_PATH}:/tmp/dumps/neo4j.dump
    ports:
      - 7474:7474
      - 7687:7687
#    depends_on:
#      neo4j_load_data:
#        condition: service_completed_successfully
    networks:
      - resilmesh_network
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474/"]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

#  neo4j_load_data:
